<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Umfrage</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<script>
  // Farbschema wie im Office-Tool: dem System folgen
  if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
</script>
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100vh; }
  .sv-page { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
  .sv-page h1 { font-family: 'Newsreader', serif; font-size: 30px; margin: 0 0 6px; line-height: 1.15; }
  .sv-desc { white-space: pre-wrap; color: var(--ink-soft); margin: 0 0 6px; }
  .sv-meta { color: var(--ink-faint); font-size: 13px; margin-bottom: 18px; }
  .sv-page .card { margin-bottom: 16px; }
  .sv-section-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 18px 0 6px; }
  .sv-section-title h3 { margin: 0; font-size: 15px; }
  .sv-opt { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .sv-opt:first-of-type { border-top: none; }
  .sv-opt-label { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 14px; }
  .sv-opt-label small { color: var(--ink-faint); font-size: 12px; }
  .sv-choice { display: flex; gap: 6px; flex-shrink: 0; }
  .sv-choice button {
    width: 44px; height: 38px; padding: 0; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--panel); color: var(--ink-soft); font-size: 17px; font-weight: 700; box-shadow: none;
  }
  .sv-choice button.on[data-v="yes"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .sv-choice button.on[data-v="maybe"] { background: var(--warn); border-color: var(--warn); color: #fff; }
  .sv-choice button.on[data-v="no"] { background: var(--danger); border-color: var(--danger); color: #fff; }
  .sv-done { background: var(--ok-soft); border: 1px solid var(--ok); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }
  .sv-done code { word-break: break-all; font-size: 12px; }
  .sv-closed { background: var(--warn-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
  .sv-error { color: var(--danger); font-size: 13px; margin: 8px 0 0; }
  .sv-submit { width: 100%; margin-top: 14px; padding: 12px; font-size: 15px; }
  .sv-page:has(.sv-me) { max-width: 1100px; }
  @media (min-width: 821px) { .sv-page:has(.sv-fit) { max-width: none; padding-left: 24px; padding-right: 24px; } }
  .sv-join { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 8px; }
  .sv-join input { flex: 1 1 180px; margin: 0; }
  .sv-join select { flex: 1 1 160px; width: auto; margin: 0; }
  .sv-me details summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13px; }
  .sv-me textarea { width: 100%; margin-bottom: 8px; }
  .sv-legend b { padding: 0 5px; border-radius: 4px; }
</style>
</head>
<body>
<main class="sv-page" id="app"><p class="empty-state">Lädt …</p></main>
<script src="/umfrage-table.js"></script>
<script>
(function () {
  const { esc, fmtDate, weekday, sections, render, nextValue, statsHtml, bindStats, hasPerson } = window.SurveyTable;
  let statsPick = null;
  const statsId = () => (hasPerson(data, statsPick) ? statsPick : (data.own ? 'r' + data.own.id : null));
  const token = location.pathname.split('/').pop();
  const storeKey = 'umfrage_' + token;
  const params = new URLSearchParams(location.search);
  let editToken = params.get('e');
  try { if (editToken) localStorage.setItem(storeKey, editToken); else editToken = localStorage.getItem(storeKey); } catch (e) { /* ohne Speicher geht es auch */ }
  let data = null;
  let answers = {};
  let justSaved = false;
  const app = document.getElementById('app');

  async function load() {
    const res = await fetch(`/api/public/umfrage/${token}` + (editToken ? `?e=${encodeURIComponent(editToken)}` : ''));
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { app.innerHTML = `<h1>Umfrage</h1><p>${esc(body.error || 'Die Umfrage konnte nicht geladen werden.')}</p>`; return; }
    data = body;
    answers = data.own ? { ...data.own.answers } : {};
    document.title = data.title;
    renderPage();
  }

  function optionLabel(o) {
    const main = [o.label, o.date && `${weekday(o.date)}, ${fmtDate(o.date)}`].filter(Boolean).join(' · ');
    return `<span class="sv-opt-label"><strong>${esc(main || 'Termin')}</strong>${o.time || o.note ? `<small>${esc([o.time, o.note].filter(Boolean).join(' · '))}</small>` : ''}</span>`;
  }

  function renderPage() {
    if (data.layout === 'table') return renderTablePage();
    const open = data.status === 'offen';
    const own = data.own;
    const values = data.allow_maybe ? ['yes', 'maybe', 'no'] : ['yes', 'no'];
    const sym = { yes: '✓', maybe: '?', no: '✗' };
    const title = { yes: 'Zusage', maybe: 'Vielleicht', no: 'Absage' };
    const editLink = editToken ? `${location.origin}/u/${token}?e=${editToken}` : '';
    app.innerHTML = `
      <h1>${esc(data.title)}</h1>
      ${data.description ? `<p class="sv-desc">${esc(data.description)}</p>` : ''}
      <div class="sv-meta">${data.deadline ? `Bitte antworten bis ${fmtDate(data.deadline)}` : ''}</div>
      ${justSaved ? `<div class="sv-done"><strong>Danke, deine Antwort ist gespeichert.</strong><br>
        Du kannst sie auf diesem Gerät jederzeit hier ändern. Für ein anderes Gerät diesen persönlichen Link aufheben:<br><code>${esc(editLink)}</code></div>` : ''}
      ${!open ? '<div class="sv-closed">Die Umfrage ist geschlossen – Antworten sind nicht mehr möglich.</div>' : ''}
      ${open ? `<form class="card" id="sv-form">
        <h3 style="margin-top:0">${own ? 'Deine Antwort ändern' : 'Deine Antwort'}</h3>
        <div class="${data.roles.length ? 'time-row' : ''}">
          <label>Name <input type="text" id="sv-name" required maxlength="100" value="${esc(own ? own.name : '')}" autocomplete="name"></label>
          ${data.roles.length ? `<label>Rolle / Aufgabe <select id="sv-role"><option value="">— bitte wählen —</option>${data.roles.map(r => `<option ${own && own.role === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></label>` : ''}
        </div>
        ${sections(data.options).map((sec, si) => `
          <div class="sv-section-title"><h3>${esc(sec.name || (data.options.length > 1 ? 'Termine' : ''))}</h3>
            <button type="button" class="ghost" data-all="${si}">Bei allen zusagen</button></div>
          ${sec.options.map(o => `<div class="sv-opt">${optionLabel(o)}<div class="sv-choice">${values.map(v =>
            `<button type="button" data-o="${o.id}" data-v="${v}" title="${title[v]}" aria-label="${title[v]}" class="${answers[o.id] === v ? 'on' : ''}">${sym[v]}</button>`).join('')}</div></div>`).join('')}
        `).join('')}
        <label style="margin-top:14px">Kommentar (optional) <textarea id="sv-comment" rows="2" maxlength="1000">${esc(own ? own.comment || '' : '')}</textarea></label>
        <button type="submit" class="sv-submit">${own ? 'Änderung speichern' : 'Antwort absenden'}</button>
        <p class="sv-error hidden" id="sv-error"></p>
      </form>` : ''}
      ${data.show_results ? `<div class="card"><h3 style="margin-top:0">Bisherige Antworten <span class="count-chip">${data.responses.length}</span></h3>
        ${render(data, { ownId: own && own.id })}</div>
        ${statsHtml(data, statsId()) ? `<div class="card">${statsHtml(data, statsId())}</div>` : ''}` : ''}`;
    bindStats(app, data, (rid) => { statsPick = rid; });

    if (!open) return;
    const secs = sections(data.options);
    app.querySelectorAll('.sv-choice button').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.o;
      answers[id] = answers[id] === b.dataset.v ? undefined : b.dataset.v;
      b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', answers[id] === x.dataset.v));
    }));
    app.querySelectorAll('[data-all]').forEach(b => b.addEventListener('click', () => {
      secs[+b.dataset.all].options.forEach(o => { answers[o.id] = 'yes'; });
      secs[+b.dataset.all].options.forEach(o => app.querySelectorAll(`[data-o="${o.id}"]`).forEach(x => x.classList.toggle('on', x.dataset.v === 'yes')));
    }));
    document.getElementById('sv-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('sv-error');
      const roleSel = document.getElementById('sv-role');
      if (roleSel && !roleSel.value) { err.textContent = 'Bitte deine Rolle / Aufgabe wählen.'; err.classList.remove('hidden'); return; }
      const clean = {};
      Object.entries(answers).forEach(([k, v]) => { if (v) clean[k] = v; });
      const res = await fetch(`/api/public/umfrage/${token}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('sv-name').value, role: roleSel ? roleSel.value : null,
          comment: document.getElementById('sv-comment').value, answers: clean, edit_token: editToken,
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) { err.textContent = body.error || 'Speichern fehlgeschlagen.'; err.classList.remove('hidden'); return; }
      editToken = body.edit_token;
      try { localStorage.setItem(storeKey, editToken); } catch (ex) { /* egal */ }
      data = body;
      answers = { ...data.own.answers };
      justSaved = true;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // ---- Tabellen-Modus: alle tragen sich direkt in die Tabelle ein ----
  const pendingRows = new Map(); // rid -> Timer
  let tableMsg = '';

  async function saveOwn(extra = {}) {
    const own = data.own;
    const res = await fetch(`/api/public/umfrage/${token}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: extra.name ?? own.name, role: extra.role !== undefined ? extra.role : own.role,
        comment: extra.comment !== undefined ? extra.comment : own.comment,
        answers: extra.answers || own.answers, edit_token: editToken,
      }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || 'Speichern fehlgeschlagen.');
    editToken = body.edit_token;
    try { localStorage.setItem(storeKey, editToken); } catch (ex) { /* egal */ }
    return body;
  }

  function saveRowSoon(r) {
    clearTimeout(pendingRows.get(r.id));
    pendingRows.set(r.id, setTimeout(async () => {
      try {
        let body;
        if (data.own && data.own.id === r.id) body = await saveOwn({ answers: r.answers });
        else {
          const res = await fetch(`/api/public/umfrage/${token}/${r.id}` + (editToken ? `?e=${encodeURIComponent(editToken)}` : ''), {
            method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers: r.answers }),
          });
          body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(body.error || 'Speichern fehlgeschlagen.');
        }
        pendingRows.delete(r.id);
        if (!pendingRows.size) { data = body; renderTablePage(); }
      } catch (err) {
        pendingRows.delete(r.id);
        tableMsg = err.message;
        load();
      }
    }, 500));
  }

  async function join(name, role) {
    if (!name) { tableMsg = 'Bitte zuerst deinen Namen eingeben.'; renderTablePage(); document.getElementById('sv-name').focus(); return; }
    if (data.roles.length && !role) { tableMsg = 'Bitte deine Rolle / Aufgabe wählen.'; renderTablePage(); return; }
    try {
      const res = await fetch(`/api/public/umfrage/${token}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, role: role || null, answers: data.own ? data.own.answers : {}, comment: data.own ? data.own.comment : null, edit_token: editToken }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || 'Eintragen fehlgeschlagen.');
      editToken = body.edit_token;
      try { localStorage.setItem(storeKey, editToken); } catch (ex) { /* egal */ }
      data = body;
      tableMsg = '';
      renderTablePage();
    } catch (err) { tableMsg = err.message; renderTablePage(); }
  }

  function renderTablePage() {
    const open = data.status === 'offen';
    const own = data.own;
    const editLink = editToken ? `${location.origin}/u/${token}?e=${editToken}` : '';
    const typedName = (document.getElementById('sv-name') || {}).value;
    const roleSelect = (selected) => data.roles.length ? `<select id="sv-role"><option value="">— Rolle / Aufgabe —</option>${data.roles.map(r => `<option ${selected === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>` : '';
    app.innerHTML = `
      <h1>${esc(data.title)}</h1>
      ${data.description ? `<p class="sv-desc">${esc(data.description)}</p>` : ''}
      <div class="sv-meta">${data.deadline ? `Bitte eintragen bis ${fmtDate(data.deadline)}` : ''}</div>
      ${!open ? '<div class="sv-closed">Die Umfrage ist geschlossen – Änderungen sind nicht mehr möglich.</div>' : ''}
      ${open ? `<div class="card sv-me">
        ${own ? `<p style="margin:0 0 8px">Du bist eingetragen als <strong>${esc(own.name)}</strong>${own.role ? ` (${esc(own.role)})` : ''}. Klicke in deiner Zeile auf die Termine: <span class="sv-legend">leer → <b class="sv-yes">✓</b> → ${data.allow_maybe ? '<b class="sv-maybe">?</b> → ' : ''}<b class="sv-no">✗</b> → leer</span></p>
          <details><summary>Name, Rolle oder Kommentar ändern</summary>
            <div class="sv-join">
              <input type="text" id="sv-name" maxlength="100" value="${esc(own.name)}" aria-label="Name">${roleSelect(own.role)}
            </div>
            <textarea id="sv-comment" rows="2" maxlength="1000" placeholder="Kommentar (optional)">${esc(own.comment || '')}</textarea>
            <button type="button" id="sv-own-save">Speichern</button>
            <p class="hint" style="margin-top:8px">Dein persönlicher Link für andere Geräte:<br><code>${esc(editLink)}</code></p>
          </details>`
        : `<p style="margin:0 0 8px"><strong>Trag dich ein:</strong> Name${data.roles.length ? ' und Rolle' : ''} eingeben, dann in deiner Zeile die Termine anklicken.</p>
          <div class="sv-join">
            <input type="text" id="sv-name" maxlength="100" placeholder="Dein Name" value="${esc(typedName || '')}" autocomplete="name" aria-label="Name">${roleSelect('')}
            <button type="button" id="sv-join">Eintragen</button>
          </div>`}
        ${data.open_edit ? '<p class="hint" style="margin:8px 0 0">In dieser Tabelle dürfen alle alle Zeilen ändern.</p>' : ''}
        ${tableMsg ? `<p class="sv-error">${esc(tableMsg)}</p>` : ''}
      </div>` : ''}
      <div class="card">
        <h3 style="margin-top:0">Tabelle <span class="count-chip">${data.responses.length}</span></h3>
        ${render(data, { ownId: own && own.id, canEdit: (r) => open && ((own && own.id === r.id) || data.open_edit), canEditCast: open, claim: open && data.roles.length > 0 })}
      </div>
      ${statsHtml(data, statsId()) ? `<div class="card">${statsHtml(data, statsId())}</div>` : ''}`;
    bindStats(app, data, (rid) => { statsPick = rid; });
    tableMsg = '';
    if (!open) return;

    const joinBtn = document.getElementById('sv-join');
    if (joinBtn) joinBtn.addEventListener('click', () => join(document.getElementById('sv-name').value.trim(), (document.getElementById('sv-role') || {}).value));
    const ownSave = document.getElementById('sv-own-save');
    if (ownSave) ownSave.addEventListener('click', async () => {
      try {
        data = await saveOwn({ name: document.getElementById('sv-name').value.trim(), role: (document.getElementById('sv-role') || {}).value || null, comment: document.getElementById('sv-comment').value });
        renderTablePage();
      } catch (err) { tableMsg = err.message; renderTablePage(); }
    });
    // "eintragen" in einer freien Rollen-Zeile: mit eingegebenem Namen eintragen bzw. eigene Zeile dorthin verschieben
    app.querySelectorAll('[data-sv-claim]').forEach(b => b.addEventListener('click', () => {
      const name = own ? own.name : (document.getElementById('sv-name') || {}).value.trim();
      join(name, b.dataset.svClaim);
    }));
    // Besetzung: in der Rollen-Zeile auswaehlen, wer den Termin spielt
    app.querySelectorAll('[data-sv-cast]').forEach(sel => sel.addEventListener('change', async () => {
      const [ri, oid] = sel.dataset.svCast.split(':').map(Number);
      const role = data.roles[ri];
      try {
        const res = await fetch(`/api/public/umfrage/${token}/cast` + (editToken ? `?e=${encodeURIComponent(editToken)}` : ''), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role, option_id: oid, person: sel.value }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || 'Speichern fehlgeschlagen.');
        data = body;
      } catch (err) { tableMsg = err.message; }
      renderTablePage();
      const again = app.querySelector(`[data-sv-cast="${ri}:${oid}"]`);
      if (again) again.focus();
    }));
    app.querySelectorAll('[data-sv-cell]').forEach(td => {
      const toggle = () => {
        const [rid, oid] = td.dataset.svCell.split(':').map(Number);
        const r = data.responses.find(x => x.id === rid);
        if (!r) return;
        const v = nextValue(r.answers[oid], data.allow_maybe);
        if (v) r.answers[oid] = v; else delete r.answers[oid];
        if (data.own && data.own.id === rid) data.own.answers = r.answers;
        renderTablePage();
        const again = app.querySelector(`[data-sv-cell="${rid}:${oid}"]`);
        if (again) again.focus();
        saveRowSoon(r);
      };
      td.addEventListener('click', toggle);
      td.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } });
    });
  }

  load();
})();
</script>
</body>
</html>
