<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Anmelden – Office-Tool</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0d1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Office-Tool">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<script>
  // Farbschema vor dem ersten Zeichnen setzen (kein Aufblitzen): hell, dunkel oder System
  (function () {
    var t = 'light';
    try { t = localStorage.getItem('office_theme') || 'light'; } catch (e) {}
    document.documentElement.dataset.theme = t;
    var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = dark ? '#0d1015' : '#ece5d8';
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>Office-Tool</h1>
    <p class="hint">Bitte anmelden.</p>
    <form id="login-form">
      <label>Benutzername
        <input type="text" id="login-username" required autofocus autocomplete="username">
      </label>
      <label>Passwort
        <input type="password" id="login-password" required autocomplete="current-password">
      </label>
      <div id="login-error" class="login-error hidden"></div>
      <div class="form-actions">
        <button type="submit">Anmelden</button>
      </div>
    </form>
  </div>
  <script src="login.js"></script>
</body>
</html>
