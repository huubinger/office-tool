<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Umfrage</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<script>
  // Farbschema wie im Office-Tool: dem System folgen
  if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
</script>
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100vh; }
  .sv-page { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
  .sv-page h1 { font-family: 'Newsreader', serif; font-size: 30px; margin: 0 0 6px; line-height: 1.15; }
  .sv-desc { white-space: pre-wrap; color: var(--ink-soft); margin: 0 0 6px; }
  .sv-meta { color: var(--ink-faint); font-size: 13px; margin-bottom: 18px; }
  .sv-page .card { margin-bottom: 16px; }
  .sv-section-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 18px 0 6px; }
  .sv-section-title h3 { margin: 0; font-size: 15px; }
  .sv-opt { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .sv-opt:first-of-type { border-top: none; }
  .sv-opt-label { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 14px; }
  .sv-opt-label small { color: var(--ink-faint); font-size: 12px; }
  .sv-choice { display: flex; gap: 6px; flex-shrink: 0; }
  .sv-choice button {
    width: 44px; height: 38px; padding: 0; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--panel); color: var(--ink-soft); font-size: 17px; font-weight: 700; box-shadow: none;
  }
  .sv-choice button.on[data-v="yes"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .sv-choice button.on[data-v="maybe"] { background: var(--warn); border-color: var(--warn); color: #fff; }
  .sv-choice button.on[data-v="no"] { background: var(--danger); border-color: var(--danger); color: #fff; }
  .sv-done { background: var(--ok-soft); border: 1px solid var(--ok); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }
  .sv-done code { word-break: break-all; font-size: 12px; }
  .sv-closed { background: var(--warn-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
  .sv-error { color: var(--danger); font-size: 13px; margin: 8px 0 0; }
  .sv-submit { width: 100%; margin-top: 14px; padding: 12px; font-size: 15px; }
  .sv-page:has(.sv-me) { max-width: 1100px; }
  @media (min-width: 821px) { .sv-page:has(.sv-fit) { max-width: none; padding-left: 24px; padding-right: 24px; } }
  .sv-join { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 8px; }
  .sv-join input { flex: 1 1 180px; margin: 0; }
  .sv-join select { flex: 1 1 160px; width: auto; margin: 0; }
  .sv-me details summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13px; }
  .sv-me textarea { width: 100%; margin-bottom: 8px; }
  .sv-legend b { padding: 0 5px; border-radius: 4px; }
  /* Termine beim Scrollen mitnehmen: Tabelle scrollt in sich, Kopf und Namensspalte bleiben stehen */
  /* Handy: Meine Termine */
  .sv-page { --sv-m-line: var(--line-strong, #3a4250); }
  .sv-m-tabs { display: flex; gap: 4px; padding: 4px; margin: 4px 0 14px; background: var(--panel-alt); border-radius: 12px; position: sticky; top: 8px; z-index: 5; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .sv-m-tabs button { flex: 1; padding: 10px 8px; font-size: 14px; font-weight: 700; border-radius: 9px; border: none; background: transparent; color: var(--ink-soft); box-shadow: none; }
  .sv-m-tabs button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .sv-m-who label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .sv-m-who select { width: 100%; font-size: 16px; padding: 12px; margin: 0; }
  .sv-m-join { margin-top: 10px; font-size: 14px; }
  .sv-m-join summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .sv-m-join .sv-join input, .sv-m-join .sv-join select { font-size: 16px; }
  .sv-m-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 8px; }
  .sv-m-chip { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--panel-alt); color: var(--ink-soft); }
  .sv-m-chip.sv-m-c-yes { background: var(--ok-soft); color: var(--ok); } .sv-m-chip.sv-m-c-no { background: var(--danger-soft); color: var(--danger); }
  .sv-m-plays { margin-left: auto; font-size: 13px; color: var(--ink-soft); }
  .sv-m-plays b { color: var(--ink); font-size: 15px; }
  .sv-m-allyes { width: 100%; padding: 11px; font-size: 14px; margin-bottom: 6px; }
  .sv-m-hint { margin: 4px 0 6px; font-size: 13px; }
  .sv-m-month { margin: 18px 0 8px; font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
  .sv-m-opt { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .sv-m-opt.sv-m-yes { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
  .sv-m-opt.sv-m-no { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
  .sv-m-ersatz { background-image: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--warn) 14%, transparent) 7px 9px); }
  .sv-m-top { display: flex; align-items: center; gap: 10px; }
  .sv-m-date { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .sv-m-date b { font-size: 16px; }
  .sv-m-date span { font-size: 13px; color: var(--ink-soft); }
  .sv-m-ersatz .sv-m-date span { color: var(--warn); font-weight: 600; }
  .sv-m-ans { display: flex; gap: 6px; flex-shrink: 0; }
  .sv-m-ans button { width: 52px; height: 46px; padding: 0; border-radius: 12px; border: 1.5px solid var(--sv-m-line); background: var(--panel); color: var(--ink-faint); font-size: 20px; font-weight: 800; box-shadow: none; }
  .sv-m-ans button.on[data-v="yes"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .sv-m-ans button.on[data-v="maybe"] { background: var(--warn); border-color: var(--warn); color: #fff; }
  .sv-m-ans button.on[data-v="no"] { background: var(--danger); border-color: var(--danger); color: #fff; }
  .sv-m-cast { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sv-m-castlbl { font-size: 12px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; }
  .sv-m-castbtns { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .sv-m-castbtns button { padding: 7px 12px; min-height: 38px; border-radius: 999px; font-size: 14px; font-weight: 600; border: 1.5px solid var(--sv-m-line); background: var(--panel); color: var(--ink); box-shadow: none; }
  .sv-m-castbtns button.on { background: var(--sv-c, var(--accent)); border-color: var(--sv-c, var(--accent)); color: #fff; }
  .sv-m-castbtns button.sv-cast-i0 { --sv-c: var(--ok); } .sv-m-castbtns button.sv-cast-i1 { --sv-c: var(--violet-ink); }
  .sv-m-castbtns button.sv-cast-i2 { --sv-c: var(--warn); } .sv-m-castbtns button.sv-cast-i3 { --sv-c: var(--ink-soft); }
  .sv-m-castbtns small { font-weight: 800; }
  .sv-m-castbtns .sv-m-a-yes { color: var(--ok); } .sv-m-castbtns .sv-m-a-no { color: var(--danger); } .sv-m-castbtns .sv-m-a-maybe { color: var(--warn); }
  .sv-m-castbtns button.on small { color: #fff; }
  .sv-m-warn { width: 100%; font-size: 12.5px; color: var(--danger); font-weight: 600; }
  .sv-m-empty { color: var(--ink-soft); text-align: center; padding: 24px 8px; }
  @media (max-width: 760px) {
    .sv-page.sv-tablepage { padding: 18px 12px 48px; }
    .sv-tablepage h1 { font-size: 25px; }
    .sv-page.sv-tablepage .sv-table-wrap { max-height: calc(100vh - 80px); max-height: calc(100dvh - 80px); }
  }
  .sv-tablepage .sv-table-wrap { max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow: auto; }
  .sv-tablepage .sv-table thead { position: sticky; top: 0; z-index: 3; }
  .sv-tablepage .sv-table thead th { background-color: var(--panel); }
  .sv-tablepage .sv-table tfoot { position: sticky; bottom: 0; z-index: 3; }
  .sv-tablepage .sv-table tfoot th, .sv-tablepage .sv-table tfoot td { background-color: var(--panel); }
</style>
</head>
<body>
<main class="sv-page" id="app"><p class="empty-state">Lädt …</p></main>
<script src="/umfrage-table.js"></script>
<script>
(function () {
  const { esc, fmtDate, weekday, sections, render, nextValue, statsHtml, bindStats, hasPerson, isCastMember, castOf, isErsatz, ordered } = window.SurveyTable;
  let statsPick = null;
  const statsId = () => (hasPerson(data, statsPick) ? statsPick : (data.own ? 'r' + data.own.id : null));
  const token = location.pathname.split('/').pop();
  const storeKey = 'umfrage_' + token;
  const params = new URLSearchParams(location.search);
  let editToken = params.get('e');
  try { if (editToken) localStorage.setItem(storeKey, editToken); else editToken = localStorage.getItem(storeKey); } catch (e) { /* ohne Speicher geht es auch */ }
  let data = null;
  let answers = {};
  let justSaved = false;
  const app = document.getElementById('app');

  async function load() {
    const res = await fetch(`/api/public/umfrage/${token}` + (editToken ? `?e=${encodeURIComponent(editToken)}` : ''));
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { app.innerHTML = `<h1>Umfrage</h1><p>${esc(body.error || 'Die Umfrage konnte nicht geladen werden.')}</p>`; return; }
    data = body;
    answers = data.own ? { ...data.own.answers } : {};
    document.title = data.title;
    renderPage();
  }

  function optionLabel(o) {
    const main = [o.label, o.date && `${weekday(o.date)}, ${fmtDate(o.date)}`].filter(Boolean).join(' · ');
    return `<span class="sv-opt-label"><strong>${esc(main || 'Termin')}</strong>${o.time || o.note ? `<small>${esc([o.time, o.note].filter(Boolean).join(' · '))}</small>` : ''}</span>`;
  }

  function renderPage() {
    if (data.layout === 'table') return renderTablePage();
    const open = data.status === 'offen';
    const own = data.own;
    const values = data.allow_maybe ? ['yes', 'maybe', 'no'] : ['yes', 'no'];
    const sym = { yes: '✓', maybe: '?', no: '✗' };
    const title = { yes: 'Zusage', maybe: 'Vielleicht', no: 'Absage' };
    const editLink = editToken ? `${location.origin}/u/${token}?e=${editToken}` : '';
    app.innerHTML = `
      <h1>${esc(data.title)}</h1>
      ${data.description ? `<p class="sv-desc">${esc(data.description)}</p>` : ''}
      <div class="sv-meta">${data.deadline ? `Bitte antworten bis ${fmtDate(data.deadline)}` : ''}</div>
      ${justSaved ? `<div class="sv-done"><strong>Danke, deine Antwort ist gespeichert.</strong><br>
        Du kannst sie auf diesem Gerät jederzeit hier ändern. Für ein anderes Gerät diesen persönlichen Link aufheben:<br><code>${esc(editLink)}</code></div>` : ''}
      ${!open ? '<div class="sv-closed">Die Umfrage ist geschlossen – Antworten sind nicht mehr möglich.</div>' : ''}
      ${open ? `<form class="card" id="sv-form">
        <h3 style="margin-top:0">${own ? 'Deine Antwort ändern' : 'Deine Antwort'}</h3>
        <div class="${data.roles.length ? 'time-row' : ''}">
          <label>Name <input type="text" id="sv-name" required maxlength="100" value="${esc(own ? own.name : '')}" autocomplete="name"></label>
          ${data.roles.length ? `<label>Rolle / Aufgabe <select id="sv-role"><option value="">— bitte wählen —</option>${data.roles.map(r => `<option ${own && own.role === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></label>` : ''}
        </div>
        ${sections(data.options).map((sec, si) => `
          <div class="sv-section-title"><h3>${esc(sec.name || (data.options.length > 1 ? 'Termine' : ''))}</h3>
            <button type="button" class="ghost" data-all="${si}">Bei allen zusagen</button></div>
          ${sec.options.map(o => `<div class="sv-opt">${optionLabel(o)}<div class="sv-choice">${values.map(v =>
            `<button type="button" data-o="${o.id}" data-v="${v}" title="${title[v]}" aria-label="${title[v]}" class="${answers[o.id] === v ? 'on' : ''}">${sym[v]}</button>`).join('')}</div></div>`).join('')}
        `).join('')}
        <label style="margin-top:14px">Kommentar (optional) <textarea id="sv-comment" rows="2" maxlength="1000">${esc(own ? own.comment || '' : '')}</textarea></label>
        <button type="submit" class="sv-submit">${own ? 'Änderung speichern' : 'Antwort absenden'}</button>
        <p class="sv-error hidden" id="sv-error"></p>
      </form>` : ''}
      ${data.show_results ? `<div class="card"><h3 style="margin-top:0">Bisherige Antworten <span class="count-chip">${data.responses.length}</span></h3>
        ${render(data, { ownId: own && own.id })}</div>
        ${statsHtml(data, statsId()) ? `<div class="card">${statsHtml(data, statsId())}</div>` : ''}` : ''}`;
    SurveyTable.fit(app);
    bindStats(app, data, (rid) => { statsPick = rid; });

    if (!open) return;
    const secs = sections(data.options);
    app.querySelectorAll('.sv-choice button').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.o;
      answers[id] = answers[id] === b.dataset.v ? undefined : b.dataset.v;
      b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', answers[id] === x.dataset.v));
    }));
    app.querySelectorAll('[data-all]').forEach(b => b.addEventListener('click', () => {
      secs[+b.dataset.all].options.forEach(o => { answers[o.id] = 'yes'; });
      secs[+b.dataset.all].options.forEach(o => app.querySelectorAll(`[data-o="${o.id}"]`).forEach(x => x.classList.toggle('on', x.dataset.v === 'yes')));
    }));
    document.getElementById('sv-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('sv-error');
      const roleSel = document.getElementById('sv-role');
      if (roleSel && !roleSel.value) { err.textContent = 'Bitte deine Rolle / Aufgabe wählen.'; err.classList.remove('hidden'); return; }
      const clean = {};
      Object.entries(answers).forEach(([k, v]) => { if (v) clean[k] = v; });
      const res = await fetch(`/api/public/umfrage/${token}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('sv-name').value, role: roleSel ? roleSel.value : null,
          comment: document.getElementById('sv-comment').value, answers: clean, edit_token: editToken,
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) { err.textContent = body.error || 'Speichern fehlgeschlagen.'; err.classList.remove('hidden'); return; }
      editToken = body.edit_token;
      try { localStorage.setItem(storeKey, editToken); } catch (ex) { /* egal */ }
      data = body;
      answers = { ...data.own.answers };
      justSaved = true;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // ---- Tabellen-Modus: alle tragen sich direkt in die Tabelle ein ----
  const pendingRows = new Map(); // rid -> Timer
  let tableMsg = '';

  async function saveOwn(extra = {}) {
    const own = data.own;
    const res = await fetch(`/api/public/umfrage/${token}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: extra.name ?? own.name, role: extra.role !== undefined ? extra.role : own.role,
        comment: extra.comment !== undefined ? extra.comment : own.comment,
        answers: extra.answers || own.answers, edit_token: editToken,
      }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || 'Speichern fehlgeschlagen.');
    editToken = body.edit_token;
    try { localStorage.setItem(storeKey, editToken); } catch (ex) { /* egal */ }
    return body;
  }

  // Speichern je Zeile: kurz sammeln, Anfragen je Zeile nacheinander schicken (der Server ersetzt alle Antworten
  // der Zeile), Serverstand erst übernehmen, wenn nichts mehr wartet oder läuft – sonst springen frische Klicks zurück
  const rowChain = new Map();
  let inflight = 0;
  let failed = false;
  function saveRowSoon(r) {
    const id = r.id;
    clearTimeout(pendingRows.get(id));
    const t = setTimeout(() => {
      if (pendingRows.get(id) === t) pendingRows.delete(id);
      inflight++;
      const run = (rowChain.get(id) || Promise.resolve()).then(async () => {
        const cur = data.responses.find(x => x.id === id) || r;
        try {
          let body;
          if (data.own && data.own.id === id) body = await saveOwn({ answers: cur.answers });
          else {
            const res = await fetch(`/api/public/umfrage/${token}/${id}` + (editToken ? `?e=${encodeURIComponent(editToken)}` : ''), {
              method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers: cur.answers }),
            });
            body = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(body.error || 'Speichern fehlgeschlagen.');
          }
          if (inflight === 1 && !pendingRows.size) { data = body; renderTablePage(); }
        } catch (err) {
          tableMsg = err.message;
          failed = true;
        } finally {
          inflight--;
          // nach einem Fehler neu laden, aber erst wenn nichts mehr wartet (sonst gehen lokale Klicks verloren)
          if (failed && !inflight && !pendingRows.size) { failed = false; load(); }
        }
      });
      rowChain.set(id, run);
    }, 500);
    pendingRows.set(id, t);
  }

  async function join(name, role) {
    if (!name) { tableMsg = 'Bitte zuerst deinen Namen eingeben.'; renderTablePage(); document.getElementById('sv-name').focus(); return; }
    if (data.roles.some(r => !(data.cast || {})[r]) && !role) { tableMsg = 'Bitte deine Rolle / Aufgabe wählen.'; renderTablePage(); return; }
    try {
      const res = await fetch(`/api/public/umfrage/${token}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, role: role || null, answers: data.own ? data.own.answers : {}, comment: data.own ? data.own.comment : null, edit_token: editToken }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || 'Eintragen fehlgeschlagen.');
      editToken = body.edit_token;
      try { localStorage.setItem(storeKey, editToken); } catch (ex) { /* egal */ }
      data = body;
      tableMsg = '';
      renderTablePage();
    } catch (err) { tableMsg = err.message; renderTablePage(); }
  }

  // ---- Handy: "Meine Termine" – eigenen Namen wählen, Termine untereinander mit großen Knöpfen ----
  const mobileMq = window.matchMedia('(max-width: 760px)');
  const meKey = 'umfrage_me_' + token;
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* egal */ } };
  let mView = lsGet(meKey + '_view') === 'table' ? 'table' : 'me';
  let mPick = lsGet(meKey);
  mobileMq.addEventListener('change', () => { if (data && data.layout === 'table') renderTablePage(); });

  // wen man auf dem Handy auswählen kann: Besetzung, eigene Zeile, bei offener Tabelle alle
  function mobilePeople() {
    const out = [];
    const ok = (r) => (data.own && data.own.id === r.id) || data.open_edit || isCastMember(data, r);
    data.roles.forEach(role => {
      const list = castOf(data, role)
        ? castOf(data, role).map(n => data.responses.find(r => r.role === role && r.name === n)).filter(Boolean)
        : data.responses.filter(r => r.role === role);
      const items = list.filter(ok);
      if (items.length) out.push({ role, items });
    });
    const rest = data.responses.filter(r => (!r.role || !data.roles.includes(r.role)) && ok(r));
    if (rest.length) out.push({ role: '', items: rest });
    return out;
  }

  function renderMobile() {
    app.classList.add('sv-tablepage');
    const typed = { name: (document.getElementById('sv-name') || {}).value || '', role: (document.getElementById('sv-role') || {}).value || '', open: !!(document.querySelector('.sv-m-join') || {}).open };
    const open = data.status === 'offen';
    const groups = mobilePeople();
    const all = groups.flatMap(g => g.items);
    let me = all.find(r => String(r.id) === String(mPick)) || null;
    if (!me && mPick == null && data.own) me = all.find(r => r.id === data.own.id) || null;
    const freeRoles = data.roles.filter(r => !castOf(data, r));
    const names = me && castOf(data, me.role);
    const opts = ordered(data.options);
    const sym = { yes: '✓', maybe: '?', no: '✗' };
    const ansLabel = { yes: 'kann', maybe: 'vielleicht', no: 'kann nicht' };
    const values = data.allow_maybe ? ['yes', 'maybe', 'no'] : ['yes', 'no'];
    const partner = (n) => data.responses.find(r => r.role === me.role && r.name === n);
    let html = `
      <h1>${esc(data.title)}</h1>
      ${data.description ? `<p class="sv-desc">${esc(data.description)}</p>` : ''}
      ${data.deadline ? `<div class="sv-meta">Bitte eintragen bis ${fmtDate(data.deadline)}</div>` : ''}
      ${!open ? '<div class="sv-closed">Die Umfrage ist geschlossen – Änderungen sind nicht mehr möglich.</div>' : ''}
      ${mobileTabs()}
      <div class="card sv-m-who">
        <label for="sv-m-who">Wer bist du?</label>
        <select id="sv-m-who"><option value="">— deinen Namen wählen —</option>${groups.map(g => `<optgroup label="${esc(g.role || 'Weitere')}">${g.items.map(r =>
          `<option value="${r.id}" ${me && me.id === r.id ? 'selected' : ''}>${esc(r.name)}${g.role ? ` (${esc(g.role)})` : ''}</option>`).join('')}</optgroup>`).join('')}</select>
        ${open && (freeRoles.length || !data.roles.length) && !data.own ? `<details class="sv-m-join" ${typed.open ? 'open' : ''}><summary>Nicht in der Liste? Hier eintragen</summary>
          <div class="sv-join"><input type="text" id="sv-name" maxlength="100" placeholder="Dein Name" autocomplete="name" aria-label="Name" value="${esc(typed.name)}">${freeRoles.length ? `<select id="sv-role"><option value="">— Rolle / Aufgabe —</option>${freeRoles.map(r => `<option ${typed.role === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>` : ''}<button type="button" id="sv-join">Eintragen</button></div></details>` : ''}
        ${tableMsg ? `<p class="sv-error">${esc(tableMsg)}</p>` : ''}
      </div>`;
    if (me) {
      const count = (v) => opts.filter(o => me.answers[o.id] === v).length;
      const openN = opts.filter(o => !me.answers[o.id]).length;
      const plays = names ? opts.filter(o => !isErsatz(o) && castPeople(me.role, o.id).includes(me.name)).length : 0;
      const playsE = names ? opts.filter(o => isErsatz(o) && castPeople(me.role, o.id).includes(me.name)).length : 0;
      html += `<div class="sv-m-sum">
          <span class="sv-m-chip sv-m-c-yes">✓ ${count('yes')}</span><span class="sv-m-chip sv-m-c-no">✗ ${count('no')}</span>${openN ? `<span class="sv-m-chip">${openN} offen</span>` : ''}
          ${names ? `<span class="sv-m-plays">spielt <b>${plays}</b>${playsE ? ` +${playsE} Ersatz` : ''}</span>` : ''}
        </div>
        ${open && openN ? `<button type="button" class="ghost sv-m-allyes" id="sv-m-allyes">Alle offenen auf ✓ kann</button>` : ''}
        <p class="hint sv-m-hint">Tippen speichert sofort.${names ? ` Unter „Wer spielt?“ legt ihr für ${esc(me.role)} fest, wer den Termin übernimmt.` : ''}</p>`;
      let month = null;
      html += opts.map(o => {
        const m = (o.date || '').slice(0, 7);
        const mh = m !== month ? `<h3 class="sv-m-month">${m ? `${['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'][+m.slice(5, 7) - 1]} ${m.slice(0, 4)}` : 'ohne Datum'}</h3>` : '';
        month = m;
        const v = me.answers[o.id];
        const people = names ? castPeople(me.role, o.id) : [];
        const conflict = people.some(n => { const p = partner(n); return p && p.answers[o.id] === 'no'; });
        const castRow = names ? `<div class="sv-m-cast${conflict ? ' sv-m-conflict' : ''}"><span class="sv-m-castlbl">Wer spielt?</span><div class="sv-m-castbtns">${names.map((n, i) => {
            const p = partner(n); const a = p && p.answers[o.id];
            return `<button type="button" class="sv-cast-i${i % 4}${people.length === 1 && people[0] === n ? ' on' : ''}" data-m-cast="${o.id}" data-person="${esc(n)}" ${open ? '' : 'disabled'}>${esc(n)}${a ? ` <small class="sv-m-a-${a}">${sym[a]}</small>` : ''}</button>`;
          }).join('')}${isErsatz(o) && names.length > 1 ? `<button type="button" class="${people.length > 1 ? 'on' : ''}" data-m-cast="${o.id}" data-person="${esc(names.join('/'))}" ${open ? '' : 'disabled'}>${names.length === 2 ? 'beide' : 'alle'}</button>` : ''}</div>
          ${conflict ? '<div class="sv-m-warn">Eingeteilt, hat aber „kann nicht“ angegeben</div>' : ''}</div>` : '';
        return `${mh}<div class="sv-m-opt${isErsatz(o) ? ' sv-m-ersatz' : ''}${v ? ' sv-m-' + v : ''}">
          <div class="sv-m-top">
            <div class="sv-m-date"><b>${esc(o.date ? `${weekday(o.date).slice(0, 2)} ${fmtDate(o.date).slice(0, 6)}` : (o.label || 'Termin'))}</b><span>${esc([o.date ? o.label : '', o.time, o.note].filter(Boolean).join(' · '))}</span></div>
            <div class="sv-m-ans">${values.map(x => `<button type="button" data-m-ans="${o.id}" data-v="${x}" class="${v === x ? 'on' : ''}" aria-label="${ansLabel[x]}" ${open ? '' : 'disabled'}>${sym[x]}</button>`).join('')}</div>
          </div>${castRow}</div>`;
      }).join('');
    } else {
      html += '<p class="sv-m-empty">Wähl oben deinen Namen – dann siehst du alle Termine untereinander und kannst sie antippen.</p>';
    }
    app.innerHTML = html;
    tableMsg = '';
    bindMobileCommon();
    const who = document.getElementById('sv-m-who');
    who.addEventListener('change', () => { mPick = who.value; lsSet(meKey, mPick); renderMobile(); window.scrollTo({ top: 0 }); });
    const joinBtn = document.getElementById('sv-join');
    if (joinBtn) joinBtn.addEventListener('click', async () => {
      await join(document.getElementById('sv-name').value.trim(), (document.getElementById('sv-role') || {}).value);
      if (data.own) { mPick = String(data.own.id); lsSet(meKey, mPick); renderMobile(); }
    });
    if (!me || !open) return;
    const setAns = (oid, v) => { if (v) me.answers[oid] = v; else delete me.answers[oid]; if (data.own && data.own.id === me.id) data.own.answers = me.answers; };
    app.querySelectorAll('[data-m-ans]').forEach(b => b.addEventListener('click', () => {
      const oid = +b.dataset.mAns;
      setAns(oid, me.answers[oid] === b.dataset.v ? null : b.dataset.v);
      renderMobile();
      saveRowSoon(me);
    }));
    const allYes = document.getElementById('sv-m-allyes');
    if (allYes) allYes.addEventListener('click', () => { opts.forEach(o => { if (!me.answers[o.id]) setAns(o.id, 'yes'); }); renderMobile(); saveRowSoon(me); });
    app.querySelectorAll('[data-m-cast]').forEach(b => b.addEventListener('click', async () => {
      const oid = +b.dataset.mCast;
      const person = b.classList.contains('on') ? '' : b.dataset.person;
      try {
        const res = await fetch(`/api/public/umfrage/${token}/cast` + (editToken ? `?e=${encodeURIComponent(editToken)}` : ''), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role: me.role, option_id: oid, person }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || 'Speichern fehlgeschlagen.');
        if (!pendingRows.size && !inflight) data = body; else data.cast_cells = body.cast_cells;
      } catch (err) { tableMsg = err.message; }
      renderMobile();
    }));
  }
  // Umschalter "Meine Termine" / "Ganze Tabelle"
  const mobileTabs = () => `<div class="sv-m-tabs" role="tablist"><button type="button" data-m-view="me" class="${mView === 'me' ? 'on' : ''}">Meine Termine</button><button type="button" data-m-view="table" class="${mView === 'table' ? 'on' : ''}">Ganze Tabelle</button></div>`;
  function bindMobileCommon() {
    app.querySelectorAll('[data-m-view]').forEach(b => b.addEventListener('click', () => {
      mView = b.dataset.mView; lsSet(meKey + '_view', mView); renderTablePage(); window.scrollTo({ top: 0 });
    }));
  }
  const castPeople = (role, oid) => ((((data.cast_cells || {})[role]) || {})[oid] || '').split('/').filter(Boolean);

  function renderTablePage() {
    if (mobileMq.matches && mView === 'me') return renderMobile();
    const open = data.status === 'offen';
    const own = data.own;
    const editLink = editToken ? `${location.origin}/u/${token}?e=${editToken}` : '';
    const typedName = (document.getElementById('sv-name') || {}).value;
    // Rollen mit Besetzung stehen schon mit Namen in der Tabelle und stehen hier nicht zur Wahl
    const freeRoles = data.roles.filter(r => !(data.cast || {})[r]);
    const hasCast = freeRoles.length < data.roles.length;
    const member = own && isCastMember(data, own);
    const roleSelect = (selected) => freeRoles.length ? `<select id="sv-role"><option value="">— Rolle / Aufgabe —</option>${freeRoles.map(r => `<option ${selected === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>` : '';
    app.classList.add('sv-tablepage');
    const cycle = `<span class="sv-legend">leer → <b class="sv-yes">✓</b> kann → ${data.allow_maybe ? '<b class="sv-maybe">?</b> vielleicht → ' : ''}<b class="sv-no">✗</b> kann nicht → leer</span>`;
    app.innerHTML = `
      <h1>${esc(data.title)}</h1>
      ${data.description ? `<p class="sv-desc">${esc(data.description)}</p>` : ''}
      <div class="sv-meta">${data.deadline ? `Bitte eintragen bis ${fmtDate(data.deadline)}` : ''}</div>
      ${mobileMq.matches ? mobileTabs() : ''}
      ${!open ? '<div class="sv-closed">Die Umfrage ist geschlossen – Änderungen sind nicht mehr möglich.</div>' : ''}
      ${open ? `<div class="card sv-me">
        ${member ? `<p style="margin:0 0 8px">Hallo <strong>${esc(own.name)}</strong> (${esc(own.role)})! Klick in deiner Zeile bei jedem Termin: ${cycle}. In der Zeile <strong>${esc(own.role)}</strong> wählt ihr aus, wer spielt.</p>
          <details style="margin-top:8px"><summary>Kommentar</summary>
            <textarea id="sv-comment" rows="2" maxlength="1000" placeholder="Kommentar (optional)">${esc(own.comment || '')}</textarea>
            <button type="button" id="sv-own-save">Speichern</button>
          </details>`
        : own ? `<p style="margin:0 0 8px">Du bist eingetragen als <strong>${esc(own.name)}</strong>${own.role ? ` (${esc(own.role)})` : ''}. Klicke in deiner Zeile auf die Termine: <span class="sv-legend">leer → <b class="sv-yes">✓</b> → ${data.allow_maybe ? '<b class="sv-maybe">?</b> → ' : ''}<b class="sv-no">✗</b> → leer</span></p>
          <details><summary>Name, Rolle oder Kommentar ändern</summary>
            <div class="sv-join">
              <input type="text" id="sv-name" maxlength="100" value="${esc(own.name)}" aria-label="Name">${roleSelect(own.role)}
            </div>
            <textarea id="sv-comment" rows="2" maxlength="1000" placeholder="Kommentar (optional)">${esc(own.comment || '')}</textarea>
            <button type="button" id="sv-own-save">Speichern</button>
            <p class="hint" style="margin-top:8px">Dein persönlicher Link für andere Geräte:<br><code>${esc(editLink)}</code></p>
          </details>`
        : `${hasCast ? `<p style="margin:0 0 8px"><strong>So geht's – ohne Anmeldung:</strong> Such in der Tabelle deinen Namen und klick bei jedem Termin: ${cycle}.</p>
          <p style="margin:0 0 8px">In der fett gedruckten Zeile eurer Rolle („wer spielt?“) wählt ihr per Klick aus, wer den Termin spielt. Alles wird sofort gespeichert. Die Termine oben bleiben beim Scrollen stehen.</p>` : ''}
          ${freeRoles.length || !data.roles.length ? `<p style="margin:0 0 8px"><strong>${hasCast ? 'Nicht in der Liste? ' : ''}Trag dich ein:</strong> Name${freeRoles.length ? ' und Rolle' : ''} eingeben, dann in deiner Zeile die Termine anklicken.</p>
          <div class="sv-join">
            <input type="text" id="sv-name" maxlength="100" placeholder="Dein Name" value="${esc(typedName || '')}" autocomplete="name" aria-label="Name">${roleSelect('')}
            <button type="button" id="sv-join">Eintragen</button>
          </div>` : ''}`}
        ${data.open_edit ? '<p class="hint" style="margin:8px 0 0">In dieser Tabelle dürfen alle alle Zeilen ändern.</p>' : ''}
        ${tableMsg ? `<p class="sv-error">${esc(tableMsg)}</p>` : ''}
      </div>` : ''}
      <div class="card">
        <h3 style="margin-top:0">Tabelle <span class="count-chip">${data.responses.length}</span></h3>
        ${render(data, { ownId: own && own.id, canEdit: (r) => open && ((own && own.id === r.id) || data.open_edit || isCastMember(data, r)),
          canEditCast: () => open, claim: open && freeRoles.length > 0 })}
      </div>
      ${statsHtml(data, statsId()) ? `<div class="card">${statsHtml(data, statsId())}</div>` : ''}`;
    SurveyTable.fit(app);
    bindStats(app, data, (rid) => { statsPick = rid; });
    bindMobileCommon();
    tableMsg = '';
    if (!open) return;

    const joinBtn = document.getElementById('sv-join');
    if (joinBtn) joinBtn.addEventListener('click', () => join(document.getElementById('sv-name').value.trim(), (document.getElementById('sv-role') || {}).value));
    const ownSave = document.getElementById('sv-own-save');
    if (ownSave) ownSave.addEventListener('click', async () => {
      try {
        const nameEl = document.getElementById('sv-name');
        data = await saveOwn(nameEl
          ? { name: nameEl.value.trim(), role: (document.getElementById('sv-role') || {}).value || null, comment: document.getElementById('sv-comment').value }
          : { comment: document.getElementById('sv-comment').value });
        renderTablePage();
      } catch (err) { tableMsg = err.message; renderTablePage(); }
    });
    // "eintragen" in einer freien Rollen-Zeile: mit eingegebenem Namen eintragen bzw. eigene Zeile dorthin verschieben
    app.querySelectorAll('[data-sv-claim]').forEach(b => b.addEventListener('click', () => {
      const name = own ? own.name : (document.getElementById('sv-name') || {}).value.trim();
      join(name, b.dataset.svClaim);
    }));
    // Besetzung: in der Rollen-Zeile auswaehlen, wer den Termin spielt
    app.querySelectorAll('[data-sv-cast]').forEach(sel => sel.addEventListener('change', async () => {
      const [ri, oid] = sel.dataset.svCast.split(':').map(Number);
      const role = data.roles[ri];
      try {
        const res = await fetch(`/api/public/umfrage/${token}/cast` + (editToken ? `?e=${encodeURIComponent(editToken)}` : ''), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role, option_id: oid, person: sel.value }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || 'Speichern fehlgeschlagen.');
        if (!pendingRows.size && !inflight) data = body; else data.cast_cells = body.cast_cells;
      } catch (err) { tableMsg = err.message; }
      renderTablePage();
      const again = app.querySelector(`[data-sv-cast="${ri}:${oid}"]`);
      if (again) again.focus();
    }));
    app.querySelectorAll('[data-sv-cell]').forEach(td => {
      const toggle = () => {
        const [rid, oid] = td.dataset.svCell.split(':').map(Number);
        const r = data.responses.find(x => x.id === rid);
        if (!r) return;
        const v = nextValue(r.answers[oid], data.allow_maybe);
        if (v) r.answers[oid] = v; else delete r.answers[oid];
        if (data.own && data.own.id === rid) data.own.answers = r.answers;
        renderTablePage();
        const again = app.querySelector(`[data-sv-cell="${rid}:${oid}"]`);
        if (again) again.focus();
        saveRowSoon(r);
      };
      td.addEventListener('click', toggle);
      td.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } });
    });
  }

  load();
})();
</script>
</body>
</html>
